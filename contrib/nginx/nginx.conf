map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 6080;

    # Studio dashboard (static files)
    location /studio/ {
        alias /opt/ozwell-studio/dist/;
        try_files $uri $uri/ /studio/index.html;
    }

    # ttyd (base-path aware, under /studio)
    location /studio/ttyd/ {
        proxy_pass         http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # code-server (strip /studio/code prefix)
    location /studio/code/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # MCP proxy (strip /studio/mcp prefix)
    location /studio/mcp/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_read_timeout 86400;
    }

    # Kerebron
    location /studio/@kerebron/ {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location = /getting-started.html {
        root /opt/ozwell-studio;
        internal;
    }

    # Top-level navigation to the root -> redirect to the studio dashboard.
    # Browsers send Sec-Fetch-Dest: document for a top-level page load, but
    # Sec-Fetch-Dest: iframe when loaded in an iframe (which falls through to
    # the proxied app below). Older browsers omit the header -> no redirect.
    location = / {
        # absolute_redirect off makes nginx emit a path-only Location
        # (e.g. "/studio/") instead of building an absolute URL with its own
        # listen port (6080). The browser then resolves it against its own
        # address bar URL, preserving the scheme/host/port the user actually
        # hit (e.g. https://host:443) behind a TLS-terminating proxy.
        absolute_redirect off;
        if ($http_sec_fetch_dest = "document") {
            return 302 /studio/;
        }

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
        error_page 502 =200 /getting-started.html;
    }

    # User application (served at root)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400;
        error_page 502 =200 /getting-started.html;
    }
}
